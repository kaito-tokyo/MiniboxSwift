name: Swift CI

# file: .github/workflows/swift.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# version: 1.0.0
# date: 2026-04-25

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: '/Applications/Xcode_26.4.1.app/Contents/Developer'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build
        run: swift build --configuration release --disable-sandbox

      - name: Test
        run: swift test --configuration release --disable-sandbox
